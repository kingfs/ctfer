      kind: cli
      description: AWS CLI（隔离 uv tool 环境）。
      commands:
      - aws
      path: /opt/uv-tools/awscli
      optional: true
    - name: mc
      kind: cli
      description: MinIO 客户端（S3 兼容对象存储），用于云存储类赛题。注意不是 Midnight Commander。
      commands:
      - mc
      path: /usr/local/bin/mc
      optional: true
  data:
    title: 数据 / 字典 / 模板
    description: 预置的字典、模板、浏览器与工具数据。
    components:
    - name: seclists
      kind: data
      description: 精选 SecLists 字典（密码、目录、DNS、用户名）。
      path: /opt/seclists
      notes: 环境变量 SECLISTS/WORDLISTS；完整列表可用 WITH_FULL_SECLISTS=1 构建。
    - name: rockyou
      kind: data
      description: rockyou 字典，gzip 存放，按需解压。
      path: /opt/seclists/Passwords/Leaked-Databases/rockyou.txt.gz
    - name: nuclei-templates
      kind: data
      description: nuclei 模板仓库。
      path: /opt/nuclei-templates
      notes: 环境变量 NUCLEI_TEMPLATES。
    - name: playwright-browsers
      kind: data
      description: Playwright Chromium headless shell 与 ffmpeg。
      path: /opt/playwright
      notes: 'binary: chrome-headless-shell（Playwright >= 1.50）。'
    - name: knowledge
      kind: data
      description: agent 可检索的攻防知识库（markdown，已剔除图片）：HackTricks、PayloadsAllTheThings、InternalAllTheThings。
      path: /opt/knowledge
      notes: 用 `rg` 检索；配合 ctf-manifest 使用。仅在授权目标上参考。
    - name: fingerprints
      kind: data
      description: 常见产品默认路径、默认凭据与泄漏文件清单。
      path: /opt/ctf/fingerprints.md
      commands:
      - ctf-fingerprints
    - name: playbooks
      kind: data
      description: 分题型作战手册（web/pwn/reverse/crypto/forensics/stego/AD/多阶段）。
      path: /opt/ctf/playbooks.md
      commands:
      - ctf-playbooks
  helpers:
    title: 镜像内发现与自检
    description: 查询组件、查看完整目录、验证工具链。
    components:
    - name: ctf-manifest
      kind: wrapper
      description: 按类别/关键词查询本 manifest；支持 json/raw 输出。
      commands:
      - ctf-manifest
      path: /usr/local/bin/ctf-manifest
      use_when: 不确定某工具是否已安装、需要命令名或分类时
    - name: ctf-tools
      kind: wrapper
      description: 打印人类可读的完整工具目录（TOOLS.md）。
      commands:
      - ctf-tools
      path: /usr/local/bin/ctf-tools
    - name: ctf-fingerprints
      kind: wrapper
      description: 打印常见产品指纹/默认路径/默认凭据清单。
      commands:
      - ctf-fingerprints
      path: /usr/local/bin/ctf-fingerprints
    - name: ctf-playbooks
      kind: wrapper
      description: 打印分题型作战手册。
      commands:
      - ctf-playbooks
      path: /usr/local/bin/ctf-playbooks
    - name: ctf-selftest
      kind: wrapper
      description: 验证核心工具与 Python 模块；输出 SELFTEST OK。
      commands:
      - ctf-selftest
      path: /usr/local/bin/ctf-selftest
