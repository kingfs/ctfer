schema_version: 1
manifest_version: '1.0'
updated: '2026-11-19'
image:
  name: kingfs/ctfer
  repository: https://github.com/kingfs/ctfer
  docker_hub: https://hub.docker.com/r/kingfs/ctfer
  platforms:
  - linux/amd64
  base: ubuntu:24.04
  workdir: /work
  user: root
  entrypoint: /usr/local/bin/ctfer-entrypoint
  exposed_ports:
  - 3080
  docs:
    manifest: /opt/ctf/MANIFEST.yaml
    tools: /opt/ctf/TOOLS.md
    agents: /opt/ctf/AGENTS.md
  verify:
    command: ctf-selftest
    expected: SELFTEST OK
  environment:
    SECLISTS: /opt/seclists
    WORDLISTS: /opt/seclists
    NUCLEI_TEMPLATES: /opt/nuclei-templates
    PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
    GHIDRA_HOME: /opt/ghidra
    JAVA_HOME: /opt/jdk-25
    GOROOT: /usr/local/go
    GOPATH: /root/go
    GOMODCACHE: /root/go/pkg/mod
    UV_TOOL_DIR: /opt/uv-tools
    UV_TOOL_BIN_DIR: /usr/local/bin
    SEMGREP_ENABLE_VERSION_CHECK: '0'
  default_build:
    runtime_versions:
      python: '3.12'
      node: '24'
      go: 1.27.4
      java: Temurin 25
      ruby: '3.2'
      ghidra: '12.2'
      playwright: '1.65'
      pi: 1.5.2
      codex: 0.170.0
      dsh: 0.2.2-rc.1
      pnpm: 12.21.0
      bun: 1.4.4
    build_args:
      WITH_GHIDRA: '1'
      WITH_PLAYWRIGHT: '1'
      WITH_JAVA: '1'
      WITH_RUBY: '1'
      WITH_SECLISTS: '1'
      WITH_NUCLEI_TEMPLATES: '1'
notes:
- linux/amd64 only; CTF pwn tooling and most challenge platforms assume amd64.
- Third-party CLI versions follow the upstream latest release at build time; runtime and agent versions are pinned in the
  Dockerfile.
- SageMath, Metasploit, GPU hashcat, and Windows RE suites are intentionally not included (size/licensing/drivers).
- No API keys, flags, or private tokens are baked into the image.
- Tools marked optional may be absent in slim builds (WITH_* build args) or when an upstream download fails.
categories:
  base:
    title: 基础运行时与开发工具
    description: OS、语言运行时、包管理器和日常 CLI；绝大多数题目都会用到。
    components:
    - name: ubuntu
      kind: base
      description: 基础镜像，glibc 2.39，兼容绝大多数 amd64 题目。
      version: '24.04'
    - name: python
      kind: runtime
      description: Python 3.12 venv，预装 CTF 常用库；uv/pipx 可按需安装额外 CLI。
      version: '3.12'
      commands:
      - python3
      - pip
      path: /opt/venv
      notes: python3 位于 PATH 首位；uv、pipx 也在 /opt/venv/bin。
    - name: python-managers
      kind: cli
      description: 临时安装/隔离运行 Python CLI 的工具。
      commands:
      - uv
      - pipx
      path: /opt/venv/bin
      use_when: manifest 中找不到所需 Python 工具时
    - name: node
      kind: runtime
      description: Node.js 24；dsh 要求 Node >= 24.9。
      version: '24'
      commands:
      - node
      - npm
      - npx
    - name: pnpm
      kind: package-manager
      description: Node 包管理器。
      version: 12.21.0
      commands:
      - pnpm
    - name: bun
      kind: runtime
      description: Bun JavaScript 运行时/包管理器。
      version: 1.4.4
      commands:
      - bun
    - name: go
      kind: runtime
      description: Go 1.27 工具链，GOPATH=/root/go。
      version: 1.27.4
      commands:
      - go
      - gofmt
      path: /usr/local/go
    - name: java
      kind: runtime
      description: Temurin JDK 25；Ghidra 12 要求 Java 25。
      version: Temurin 25
      commands:
      - java
      - javac
      path: /opt/jdk-25
    - name: ruby
      kind: runtime
      description: Ruby 3.2 + RubyGems；承载 one_gadget/seccomp-tools/zsteg/evil-winrm。
      version: '3.2'
      commands:
      - ruby
      - gem
    - name: c-toolchain
      kind: toolchain
      description: C/C++ 构建链。
      commands:
      - gcc
      - g++
      - make
      - cmake
      - pkg-config
      - nasm
      package: build-essential cmake nasm
    - name: multilib
      kind: toolchain
      description: 32 位 x86 编译支持，pwn 题常用。
      commands:
      - gcc -m32
      - g++ -m32
      package: gcc-multilib g++-multilib libc6-dev-i386
    - name: shell-utils
      kind: suite
      description: 日常 shell/文件/远程操作工具。
      commands:
      - git
      - curl
      - wget
      - ssh
      - scp
      - rsync
      - sshpass
      - tmux
      - vim
      - less
      - tree
      - lsof
      - htop
      - file
    - name: text-utils
      kind: suite
      description: 文本/JSON/搜索/十六进制辅助工具。
      commands:
      - jq
      - yq
      - rg
      - fd
      - fzf
      - shellcheck
      - xxd
      - bc
    - name: archive-utils
      kind: suite
      description: 压缩包处理。
      commands:
      - unzip
      - zip
      - 7z
      - xz
      - zstd
      - bzip2
      - gzip
      - tar
    - name: db-clients
      kind: suite
      description: 常见数据库客户端。
      commands:
      - sqlite3
      - redis-cli
      - mariadb
      - psql
    - name: openssl
      kind: cli
      description: TLS/证书/编码/哈希工具。
      commands:
      - openssl
    - name: php
      kind: runtime
      description: PHP CLI；用于 PHP 反序列化与 phpggc 相关题目。
      version: '8.3'
      commands:
      - php
    - name: clang-llvm
      kind: toolchain
      description: Clang/LLVM 工具链；提供 libFuzzer、ASan/UBSan，用于编译 fuzz harness。
      commands:
      - clang
      - clang++
      - llvm-config
      - lld
      package: clang llvm lld
      also_in:
      - pwn
      use_when: 需要编译 fuzz harness 或带 sanitizer 的目标时
  harness:
    title: AI Agent Harness
    description: 三个 agent 执行体；API key 运行时注入，不写入镜像。
    components:
    - name: pi
      kind: harness
      description: Pi 极简可扩展 agent harness。
      version: 1.5.2
      commands:
      - pi
      package: '@earendil-works/pi-coding-agent'
      use_when: 需要轻量交互式/打印模式 agent
    - name: codex
      kind: harness
      description: OpenAI Codex CLI。
      version: 0.170.0
      commands:
      - codex
      package: '@openai/codex'
      use_when: 需要 Codex 的编辑/执行工作流
    - name: dsh
      kind: harness
      description: DeepSeek Harness CLI，也提供 Web UI。
      version: 0.2.2-rc.1
      commands:
      - dsh
      package: '@deepseek-ai/dsh'
      notes: 'Web UI: dsh web --host "$(hostname -i | cut -d" " -f1)" --port 3080 --no-open --public-url http://127.0.0.1:3080（DSH 0.2.2 拒绝 0.0.0.0；容器已 EXPOSE 3080）。'
    - name: rea
      kind: mcp
      description: REA — 面向 agent 的逆向工程 MCP 服务器/CLI，覆盖 native、JS/Electron、.NET、APK、固件、PCAP。
      version: 6.9.0
      commands:
      - rea
      - rea-agents
      path: /usr/local/lib/node_modules/rea-agents
      package: rea-agents
      optional: true
      also_in:
      - reverse
      - web
      - forensics
      use_when: 需要结构化逆向分析（伪代码/交叉引用/调用图）且 harness 支持 MCP 或 CLI 时
      notes: 复用镜像内 Ghidra（GHIDRA_INSTALL_DIR）、JADX、apktool、binwalk、tshark、pwntools。已在构建期尝试注册 dsh/pi/codex。
  web:
    title: Web 安全
    description: Web 侦察、目录/参数发现、注入、JWT、浏览器自动化与源码审计。
    components:
    - name: ffuf
      kind: cli
      description: 高性能 Web fuzzer，目录/参数/虚拟主机爆破。
      commands:
      - ffuf
      path: /usr/local/bin/ffuf
    - name: feroxbuster
      kind: cli
      description: 递归内容发现。
      commands:
      - feroxbuster
      path: /usr/local/bin/feroxbuster
    - name: gobuster
      kind: cli
      description: 目录/DNS/vhost 爆破。
      commands:
      - gobuster
    - name: dirsearch
      kind: cli
      description: 目录扫描；找不到命令时回退到 python3 -m dirsearch。
      commands:
      - dirsearch
    - name: httpx
      kind: cli
      description: HTTP 探测：状态码、标题、技术栈、指纹。
      commands:
      - httpx
      path: /usr/local/bin/httpx
    - name: whatweb
      kind: cli
      description: Web 技术栈指纹。
      commands:
      - whatweb
    - name: wafw00f
      kind: cli
      description: WAF 识别。
      commands:
      - wafw00f
    - name: nikto
      kind: cli
      description: 经典 Web 配置/漏洞检查。
      commands:
      - nikto
    - name: nuclei
      kind: cli
      description: 模板化漏洞扫描；模板位于 $NUCLEI_TEMPLATES。
      commands:
      - nuclei
      path: /usr/local/bin/nuclei
      notes: 模板路径 /opt/nuclei-templates（环境变量 NUCLEI_TEMPLATES）。
    - name: sqlmap
      kind: cli
      description: SQL 注入自动化。
      commands:
      - sqlmap
    - name: commix
      kind: cli
      description: 命令注入自动化。
      commands:
      - commix
      path: /usr/local/bin/commix
    - name: sstimap
      kind: cli
      description: SSTI 检测与利用。
      commands:
      - sstimap
      path: /usr/local/bin/sstimap
    - name: dalfox
      kind: cli
      description: XSS 扫描。
      commands:
      - dalfox
      path: /usr/local/bin/dalfox
    - name: xsstrike
      kind: cli
      description: XSS 扫描/利用。
      commands:
      - xsstrike
      path: /usr/local/bin/xsstrike
    - name: jwt_tool
      kind: cli
      description: JWT 解码、伪造与攻击。
      commands:
      - jwt_tool
      path: /usr/local/bin/jwt_tool
    - name: arjun
      kind: cli
      description: HTTP 参数发现。
      commands:
      - arjun
    - name: graphw00f
      kind: cli
      description: GraphQL 引擎指纹。
      commands:
      - graphw00f
      path: /usr/local/bin/graphw00f
      optional: true
      notes: 源码 clone 可能因上游网络失败而缺失，不影响核心自检。
    - name: clairvoyance
      kind: cli
      description: GraphQL schema/字段枚举。
      commands:
      - clairvoyance
    - name: ssrfmap
      kind: cli
      description: SSRF 探测与利用。
      commands:
      - ssrfmap
      path: /usr/local/bin/ssrfmap
    - name: mitmproxy
      kind: cli
      description: 交互式 HTTPS 代理/抓包。
      commands:
      - mitmproxy
      - mitmdump
      - mitmweb
    - name: playwright
      kind: runtime
      description: Playwright + headless Chromium，SPA/DOM XSS/截图。
      version: '1.65'
      commands:
      - playwright
      path: /opt/playwright
      optional: true
      notes: 浏览器二进制在 /opt/playwright；WITH_PLAYWRIGHT=0 可裁剪。
    - name: semgrep
      kind: cli
      description: 源码审计/秘密与危险 sink 搜索（独立 uv tool 环境）。
      commands:
      - semgrep
      path: /opt/uv-tools/semgrep
      notes: uv tool 安装，避免其 protobuf 依赖影响主 Python 环境。
    - name: subfinder
      kind: cli
      description: 子域名枚举。
      commands:
      - subfinder
      path: /usr/local/bin/subfinder
    - name: katana
      kind: cli
      description: Web 爬虫/URL 收集。
      commands:
      - katana
      path: /usr/local/bin/katana
    - name: websocat
      kind: cli
      description: WebSocket 客户端。
      commands:
      - websocat
      path: /usr/local/bin/websocat
    - name: grpcurl
      kind: cli
      description: gRPC 客户端。
      commands:
      - grpcurl
      path: /usr/local/bin/grpcurl
    - name: phpggc
      kind: cli
      description: PHP 反序列化 gadget 链生成器。
      commands:
      - phpggc
      path: /opt/phpggc/phpggc
    - name: interactsh-client
      kind: cli
      description: 带外（OOB）交互客户端，用于盲 SSRF/盲 XSS/盲命令注入。
      commands:
      - interactsh-client
      path: /usr/local/bin/interactsh-client
      optional: true
      notes: 需要出网 DNS/HTTP；仅在授权目标上使用。
    - name: fickling
      kind: library
      description: Python pickle 反序列化分析、插桩与利用。
      package: fickling
      python_modules:
      - fickling
      optional: true
    - name: ast-grep
      kind: cli
      description: 结构化源码搜索（AST 匹配），用于快速定位 sink。
      commands:
      - ast-grep
      - sg
      package: '@ast-grep/cli'
      optional: true
    - name: js-beautify
      kind: cli
      description: 前端 JS 反混淆/格式化；分析打包产物与 source map。
      commands:
      - js-beautify
      package: jsbeautifier
      optional: true
    - name: gitleaks
      kind: cli
      description: 源码/仓库密钥与凭据扫描。
      commands:
      - gitleaks
      path: /usr/local/bin/gitleaks
      optional: true
    - name: ddddocr
      kind: library
      description: 验证码/截图 OCR（onnxruntime 后端），web 题高频。
      package: ddddocr onnxruntime
      python_modules:
      - ddddocr
      optional: true
      notes: 构建期失败不阻塞；OMP_NUM_THREADS=4 限制线程数。
    - name: apache2-utils
      kind: suite
      description: htpasswd/ab — 凭据文件生成解析与 HTTP 压测。
      commands:
      - htpasswd
      - ab
      package: apache2-utils
  pwn:
    title: Pwn / 二进制利用
    description: 调试、ELF/ROP、符号执行、跨架构运行与 32 位编译。
    components:
    - name: pwntools
      kind: library
      description: pwntools：ELF/ROP/shellcraft/tubes；pwn 与 checksec 命令。
      commands:
      - pwn
      - checksec
      package: pwntools
      python_modules:
      - pwn
    - name: gdb
      kind: cli
      description: GDB、多架构 GDB、gdbserver；含 libc6-dbg 调试符号。
      commands:
      - gdb
      - gdb-multiarch
      - gdbserver
    - name: gdb-gef
      kind: wrapper
      description: GDB + GEF 插件封装。
      commands:
      - gdb-gef
      path: /usr/local/bin/gdb-gef
      notes: 默认调试体验；未内置 pwndbg。
    - name: checksec
      kind: cli
      description: ELF 缓解措施检查（apt/pwntools 均提供）。
      commands:
      - checksec
    - name: patchelf
      kind: cli
      description: 修改 ELF interpreter/rpath，适配题目 libc。
      commands:
      - patchelf
    - name: ROPgadget
      kind: cli
      description: ROP gadget 搜索。
      commands:
      - ROPgadget
    - name: ropper
      kind: cli
      description: gadget 搜索/ROP 链辅助。
      commands:
      - ropper
    - name: one_gadget
      kind: cli
      description: libc one-gadget 查找。
      commands:
      - one_gadget
    - name: seccomp-tools
      kind: cli
      description: seccomp BPF 反汇编/分析。
      commands:
      - seccomp-tools
    - name: pwninit
      kind: cli
      description: 用题目 libc 自动 patch 二进制。
      commands:
      - pwninit
      path: /usr/local/bin/pwninit
    - name: radare2
      kind: cli
      description: 反汇编/修补/r2pipe；pwn 与 reverse 通用。
      commands:
      - r2
      - radare2
      - rabin2
      - rasm2
      also_in:
      - reverse
    - name: angr
      kind: library
      description: 符号执行框架。
      package: angr
      python_modules:
      - angr
      also_in:
      - reverse
    - name: z3
      kind: library
      description: SMT 约束求解。
      package: z3-solver
      python_modules:
      - z3
      also_in:
      - crypto
    - name: binary-libs
      kind: library
      description: 二进制解析/汇编/模拟库。
      python_modules:
      - capstone
      - keystone
      - unicorn
      - lief
    - name: qemu-user
      kind: cli
      description: 用户态跨架构执行（qemu-x86_64、qemu-aarch64 等）。
      commands:
      - qemu-x86_64
      - qemu-aarch64
    - name: qemu-system
      kind: cli
      description: 系统级模拟，内核题常用。
      commands:
      - qemu-system-x86_64
    - name: tracing
      kind: cli
      description: 系统调用/库调用跟踪。
      commands:
      - strace
      - ltrace
    - name: libc6-dbg
      kind: data
      description: glibc 调试符号与源码级调试支持。
      path: /usr/lib/debug
    - name: afl
      kind: cli
      description: AFL++ 覆盖率引导 fuzz，用于找 crash / 定位解析器缺陷。
      commands:
      - afl-fuzz
      - afl-gcc
      - afl-clang-fast
      package: afl++
      notes: 与 clang/libFuzzer、ASan/UBSan 配合使用。
    - name: rlwrap
      kind: cli
      description: 为 nc/交互式程序提供 readline（历史、补全），反弹 shell 升级。
      commands:
      - rlwrap
    - name: valgrind
      kind: cli
      description: 内存错误/泄漏检测，pwn 与逆向辅助。
      commands:
      - valgrind
  reverse:
    title: Reverse / 移动逆向
    description: 静态/动态逆向、反编译、APK/Java 反序列化。
    components:
    - name: binutils
      kind: suite
      description: ELF 静态分析基础工具。
      commands:
      - objdump
      - readelf
      - nm
      - strings
      - addr2line
      - size
    - name: ghidra
      kind: cli
      description: Ghidra 12.2 headless 反编译/分析。
      version: '12.2'
      commands:
      - ghidra-headless
      path: /opt/ghidra
      optional: true
      notes: 需要 JDK 25；WITH_GHIDRA=0 可裁剪。
    - name: jadx
      kind: cli
      description: Java/APK 反编译。
      commands:
      - jadx
      path: /opt/jadx
    - name: apktool
      kind: cli
      description: APK 解码/重建。
      commands:
      - apktool
      path: /opt/apktool.jar
    - name: dex2jar
      kind: cli
      description: DEX -> JAR 转换。
      commands:
      - dex2jar
      path: /opt/dex2jar
    - name: androguard
      kind: library
      description: APK/DEX/Manifest 分析库。
      package: androguard
      python_modules:
      - androguard
    - name: ysoserial
      kind: cli
      description: Java 反序列化 payload 生成。
      commands:
      - ysoserial
      path: /opt/ysoserial-all.jar
    - name: upx
      kind: cli
      description: 可执行文件压缩/脱壳辅助。
      commands:
      - upx
    - name: wine
      kind: cli
      description: Windows PE 运行时（wine 统一启动器，含 wine32），用于动态运行/调试 Windows 逆向题。
      commands:
      - wine
      package: wine wine32:i386
      optional: true
      notes: 构建期需要 i386 架构；缺失时不影响核心自检。64 位 PE 直接用 `wine`。
    - name: ghidra-decompile
      kind: wrapper
      description: Ghidra headless 函数级反编译/反汇编，输出结构化 JSON（便于 agent 解析）。
      commands:
      - decompile
      - disassemble
      path: /usr/local/bin/decompile
      optional: true
      notes: 脚本来自 NYU CTF/D-CIPHER 工具集，已适配 /opt/ghidra 与 Ghidra 12。用法 `decompile <bin> [func]`。
    - name: craft-anything
      kind: cli
      description: Craft Anything CLI — 纯 Rust 逆向引擎（原生/.NET/Java/Android/固件/PCAP），带 MCP。
      version: 0.6.1
      commands:
      - craft-anything-cli
      path: /opt/craft-anything/craft-anything-cli
      optional: true
      notes: 上游标注 early alpha；仅 amd64 有预编译包，失败不阻塞构建。
  crypto:
    title: Crypto / 密码学
    description: 数论、SMT/格、RSA 攻击、哈希破解。
    components:
    - name: python-crypto
      kind: library
      description: Python 数学/密码库集合。
      python_modules:
      - z3
      - sympy
      - gmpy2
      - fpylll
      - flint
      - Crypto
      - Cryptodome
      - jwt
      - cryptography
      - primefac
      - factordb
    - name: pari-gp
      kind: cli
      description: PARI/GP 数论计算。
      commands:
      - gp
    - name: gmp-ecm
      kind: cli
      description: 椭圆曲线分解法。
      commands:
      - ecm
    - name: singular
      kind: cli
