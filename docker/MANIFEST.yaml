      kind: suite
      description: LDAP 查询/修改。
      commands:
      - ldapsearch
      - ldapmodify
      - ldapadd
      - ldapdelete
      - ldapwhoami
    - name: enum4linux-ng
      kind: cli
      description: SMB/AD 综合枚举。
      commands:
      - enum4linux-ng
      path: /opt/enum4linux-ng
    - name: netexec
      kind: cli
      description: NetExec（nxc）— SMB/LDAP/WinRM/MSSQL 等协议的一体化 AD 工具。
      commands:
      - nxc
      path: /opt/uv-tools/netexec
      package: netexec
      optional: true
      notes: uv tool 隔离环境，避免与主 venv 的 impacket/urllib3 冲突。
    - name: bloodyad
      kind: cli
      description: AD 写操作/权限提升工具（bloodyAD）。
      commands:
