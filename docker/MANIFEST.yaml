      commands:
      - singular
      - Singular
    - name: RsaCtfTool
      kind: cli
      description: RSA 攻击自动化。
      commands:
      - RsaCtfTool
      path: /opt/RsaCtfTool
    - name: crypto-attacks
      kind: library
      description: CTF 密码攻击库（格、RSA、ECC 等）。
      path: /opt/crypto-attacks
      notes: 按需加入 PYTHONPATH：/opt/crypto-attacks。
    - name: hashcat
      kind: cli
      description: CPU 哈希破解。
      commands:
      - hashcat
      notes: 无 GPU 版本。
    - name: john
      kind: cli
      description: John the Ripper CPU 哈希破解。
      commands:
      - john
    - name: chepy
      kind: cli
      description: Python 版 CyberChef：链式编码/加解密/取证操作，也可作为库导入。
      commands:
      - chepy
      package: chepy
      optional: true
      also_in:
      - forensics
    - name: web3
      kind: library
      description: EVM/区块链交互库，用于区块链类赛题。
      package: web3
      python_modules:
      - web3
      optional: true
      also_in:
      - web
    - name: pyecm
      kind: library
      description: 纯 Python 椭圆曲线分解（gmp-ecm 的补充实现）。
      package: pyecm
      optional: true
