      - impacket-rpcdump
      - impacket-lookupsid
      - impacket-GetNPUsers
      - impacket-GetUserSPNs
      - impacket-ntlmrelayx
      - impacket-ticketer
      - impacket-goldenPac
      - impacket-mssqlclient
      - impacket-dpapi
      path: /usr/local/bin
    - name: certipy
      kind: cli
      description: AD CS 证书服务攻击。
      commands:
      - certipy
    - name: bloodhound-python
      kind: cli
      description: BloodHound 数据采集。
      commands:
      - bloodhound-python
    - name: evil-winrm
      kind: cli
